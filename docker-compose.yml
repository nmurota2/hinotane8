# VPS 1 台で完結する構成。
#   app   … Webhook サーバー + cron バッチ
#   caddy … HTTPS 終端。Let's Encrypt の証明書を自動取得・自動更新する
#
# 起動:
#   cp .env.example .env   # 値を埋める
#   docker compose up -d --build
#
# LINE Developers の Webhook URL には
#   https://<DOMAIN>/line/webhook
# を設定する。

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/hinotane.duckdb
      TZ: Asia/Tokyo
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # cron とWebhookサーバーを同時に動かす
    command: >
      sh -c "hinotane init && cron && hinotane serve"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # 取得したドメイン名。DNS の A レコードをこの VPS に向けておくこと。
      DOMAIN: ${DOMAIN:?DOMAIN を .env に設定してください}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
